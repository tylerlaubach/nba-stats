# This docker-compose.yml is based on the official Apache Airflow template (Airflow 3.0)
# Customized for NBA Stats project with uv, dbt, Superset

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: 'America/New_York'
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    volumes:
      - ./pgdata:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    entrypoint: >
      bash -c "airflow db migrate"


  airflow-apiserver:
    <<: *airflow-common
    command: standalone
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  superset:
    image: apache/superset:latest
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SUPERSET_SECRET_KEY: "${SUPERSET_SECRET_KEY}"
      # SUPERSET_CONFIG_PATH: /superset/superset_config.py

  dbt:
    build:
      context: .
      dockerfile: Dockerfile
    image: nba-dbt
    # command: tail -f /dev/null
    entrypoint: [ "tail", "-f", "/dev/null" ]
    working_dir: /home/airflow/dbt
    volumes:
      - ./dbt:/home/airflow/dbt
    env_file:
      - .env
    environment:
      DBT_PROFILES_DIR: /home/airflow/dbt
    depends_on:
      postgres:
        condition: service_healthy

